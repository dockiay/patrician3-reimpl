[package]
name = "p3-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Control de audio de Patrician III, independiente del dispositivo de salida."

[dependencies]
symphonia = { version = "=0.6.1", default-features = false, features = ["mp3", "id3v1", "id3v2"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
