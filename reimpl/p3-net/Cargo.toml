[package]
name = "p3-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Red (M02/M03): formato de paquetes, cola, transferencia y suma de sincronía del original, y lockstep entre clientes nuevos."

[features]
# WEB-7: cliente y servidor WebSocket nativos (el TCP del original no cambia).
ws = ["dep:tungstenite"]

[dependencies]
sha2 = "0.10"
tungstenite = { version = "0.26", optional = true, default-features = false, features = ["handshake"] }

[[bin]]
name = "p3-relay"
path = "src/bin/p3-relay.rs"
required-features = ["ws"]

[dev-dependencies]
serde_json = "1"
