[package]
name = "p3-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Cliente del juego en el navegador (WEB-3): Worker con WebAssembly, OffscreenCanvas, anillo de entrada y archivos del jugador en OPFS."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
p3-mvp = { path = "../p3-mvp" }
p3-render = { path = "../p3-render" }
p3-assets = { path = "../p3-assets" }
p3-audio = { path = "../p3-audio" }
p3-web-save = { path = "../p3-web-save", features = ["embedded"] }
