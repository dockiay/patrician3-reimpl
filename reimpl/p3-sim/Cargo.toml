[package]
name = "p3-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Simulación sin pantalla (C10): carga un guardado original y avanza días con los sistemas ya reimplementados."

[dependencies]
p3-core = { path = "../p3-core" }
p3-save = { path = "../p3-save" }
p3-state = { path = "../p3-state" }
p3-assets = { path = "../p3-assets" }
sha2 = "0.10"

[[bin]]
name = "p3-sim"
path = "src/main.rs"

[dev-dependencies]
serde_json = '1'
flate2 = "1"
